[project]
name = "fin-advisor"
version = "0.1.0"
description = "Personal Financial Advisor — a standalone, model-independent AI advisory agent. Advisory-only: no broker/bank access, no trade execution."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "Ashish" }]
keywords = ["finance", "investing", "ai-agent", "discord-bot", "advisor"]

# Base install (always present). Heavy/optional libs live in [project.optional-dependencies]
# and are installed per-phase via `uv sync --extra <name>`.
dependencies = [
    "discord.py>=2.3",
    "groq>=0.11",
    "ollama>=0.3",
    "python-dotenv>=1.0",
    "httpx>=0.27",
    "apscheduler>=3.10",
    "pyyaml>=6.0",
]

[project.optional-dependencies]
# Phase 1
data = ["yfinance>=0.2.40", "ta>=0.11", "pandas>=2.0", "numpy>=1.26"]
news = ["feedparser>=6.0", "trafilatura>=1.8", "ddgs>=2.0", "vaderSentiment>=3.3"]
# Phase 3
documents = ["pypdf>=4.0"]
# Phase 4 (optional)
macro = ["fredapi>=0.5"]
finbert = ["transformers>=4.40", "torch>=2.2"]
semantic = ["sentence-transformers>=3.0", "sqlite-vec>=0.1"]
backtest = ["vectorbt>=0.26"]
openbb = ["openbb>=4.3"]
encryption = ["pysqlcipher3>=1.2"]
# Optional paid LLM SDKs
gemini = ["google-generativeai>=0.7"]
claude = ["anthropic>=0.40"]
openai = ["openai>=1.40"]

[project.scripts]
fin-advisor = "app:main"

# Dev tooling — installed by default on `uv sync`, excluded from the published package.
[dependency-groups]
dev = ["pytest>=8.0", "pytest-asyncio>=0.23"]

# Treat as an application for now (no wheel build). Flipped to a buildable package in the
# packaging step (4.7) where a build backend + [project.scripts] install are added.
[tool.uv]
package = false

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
